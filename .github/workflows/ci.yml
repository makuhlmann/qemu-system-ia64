name: CI

# Build QEMU (ia64-softmmu) + the IA-64 firmware, and run the ia64 regression
# gate (unit(ia64) + qtest-ia64).
#
# Both jobs run inside a Fedora container: Ubuntu has no IA-64 cross toolchain,
# but Fedora packages gcc-ia64-linux-gnu / binutils-ia64-linux-gnu (a
# kernel-style freestanding cross-compiler — exactly what the firmware's
# -ffreestanding -nostdlib build needs). Fedora also carries the mingw64
# toolchain upstream QEMU uses for Windows cross builds
# (tests/docker/dockerfiles/fedora-win64-cross.docker).
#
# Pinned to fedora:44 to match the local development container.

on:
  push:
    branches: [develop, main]
    paths-ignore:
      - '**.md'
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CCACHE_DIR: ${{ github.workspace }}/.ccache
  CCACHE_MAXSIZE: 1G

jobs:
  linux:
    name: Linux build + ia64 test gate
    runs-on: ubuntu-latest
    timeout-minutes: 90
    container:
      image: registry.fedoraproject.org/fedora:44
    steps:
      - name: Install dependencies
        # Beyond the bare build deps, this list mirrors the features enabled on
        # the development host that matter for using the artifacts in testing:
        # GTK+VTE and SDL2 displays, VNC with PNG/JPEG/SASL/TLS, curses, ALSA +
        # PulseAudio backends, qcow2 compression libs (zstd/lzo/snappy/bzip2),
        # curl block driver, capstone monitor disassembly, USB passthrough/
        # redirection, iSCSI. (SCSI *controller* emulation is unconditional in
        # QEMU and needs no library.)
        run: >
          dnf install -y --setopt=install_weak_deps=False
          bash bison bzip2 ccache diffutils findutils flex
          gcc gcc-c++ gdb git glib2-devel glibc-langpack-en
          libslirp-devel make meson ninja-build pixman-devel
          pkgconf-pkg-config python3 which xorriso zlib-ng-compat-devel
          gtk3-devel vte291-devel SDL2-devel SDL2_image-devel
          ncurses-devel libpng-devel libjpeg-turbo-devel
          cyrus-sasl-devel gnutls-devel
          alsa-lib-devel pulseaudio-libs-devel
          libzstd-devel lzo-devel snappy-devel bzip2-devel
          libcurl-devel capstone-devel libiscsi-devel
          libusb1-devel usbredir-devel
          gcc-ia64-linux-gnu binutils-ia64-linux-gnu acpica-tools

      - uses: actions/checkout@v4

      - name: Restore ccache
        uses: actions/cache@v4
        with:
          path: .ccache
          key: ccache-linux-${{ github.sha }}
          restore-keys: ccache-linux-

      - name: Configure
        run: |
          export PATH=/usr/lib64/ccache:$PATH
          mkdir build
          cd build
          ../configure \
            --target-list=ia64-softmmu \
            --enable-gtk \
            --enable-slirp \
            --disable-docs \
            --disable-werror \
            --disable-qom-cast-debug \
            --disable-stack-protector

      - name: Check that the install is relocatable
        # The package is used portably, so the ROMs must be found relative to
        # the binary. See the Windows job for why a single-component prefix
        # such as "/" silently turns that off. The default prefix satisfies
        # this; the check is here so a future prefix change cannot regress it.
        run: |
          prefix=$(sed -n 's/^#define CONFIG_PREFIX "\(.*\)"$/\1/p' \
                   build/config-host.h)
          case "$prefix" in
            /?*) echo "relocatable install anchored at $prefix" ;;
            *) echo "CONFIG_PREFIX '$prefix' disables relocation" >&2; exit 1 ;;
          esac

      - name: Build QEMU + firmware
        run: |
          set -o pipefail
          export PATH=/usr/lib64/ccache:$PATH
          ninja -C build 2>&1 | tee build/ninja-build.log
          ccache -s

      - name: Run ia64 regression gate
        # Includes the ATI Rage 128 device tests (qtest-ia64/ia64-vpc-test);
        # --print-errorlogs prints the failing test's TAP path on a regression.
        run: >
          build/pyvenv/bin/meson test -C build
          --suite ia64 --suite qtest-ia64
          --print-errorlogs -t 2

      - name: Run ia64 EFI functional suite
        run: >
          build/pyvenv/bin/meson test -C build
          --suite func-ia64
          --print-errorlogs -t 2

      - name: Upload firmware artifact
        uses: actions/upload-artifact@v4
        with:
          name: ia64-firmware
          path: |
            build/roms/ia64-firmware/ia64-firmware.bin
            build/roms/ia64-firmware/ia64-firmware.map
          if-no-files-found: error

      - name: Assemble Linux package
        # bin/ + share/qemu blobs + the IA-64 firmware (install:false in meson,
        # copied in explicitly). Dynamically linked against Fedora 44 libraries —
        # runs on Fedora 44+ (or a matching container), not on arbitrary distros.
        run: |
          DESTDIR=$PWD/dist ninja -C build install
          cp build/roms/ia64-firmware/ia64-firmware.bin dist/usr/local/share/qemu/
          # Link-time only: headers plus libfdt.a and its pkg-config file.
          # libexec/qemu-bridge-helper stays — it is used at runtime by
          # -netdev bridge.
          rm -rf dist/usr/local/include dist/usr/local/lib \
                 dist/usr/local/lib64

      - name: Upload Linux package
        uses: actions/upload-artifact@v4
        with:
          name: qemu-system-ia64-linux-x86_64
          path: dist/
          if-no-files-found: error

      - name: Upload test logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: linux-test-logs
          path: |
            build/meson-logs/
            build/ninja-build.log
          if-no-files-found: ignore

  windows-cross:
    name: Windows cross build (mingw64)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    container:
      image: registry.fedoraproject.org/fedora:44
    steps:
      - name: Install dependencies
        run: >
          dnf install -y --setopt=install_weak_deps=False
          bash bison bzip2 ccache diffutils findutils flex
          gcc gcc-c++ git glibc-langpack-en make meson
          ninja-build pkgconf-pkg-config python3 which
          mingw64-gcc mingw64-gcc-c++ mingw64-glib2 mingw64-pixman
          mingw64-pkg-config mingw64-SDL2 mingw64-gtk3
          mingw64-libpng mingw64-libjpeg-turbo mingw64-curl
          mingw64-gnutls mingw64-bzip2 mingw-w64-tools
          gcc-ia64-linux-gnu binutils-ia64-linux-gnu acpica-tools

      - uses: actions/checkout@v4

      - name: Restore ccache
        uses: actions/cache@v4
        with:
          path: .ccache
          key: ccache-mingw-${{ github.sha }}
          restore-keys: ccache-mingw-

      - name: Configure
        run: |
          mkdir build
          cd build
          ../configure \
            --cross-prefix=x86_64-w64-mingw32- \
            --target-list=ia64-softmmu \
            --prefix=/qemu \
            --enable-gtk \
            --enable-slirp \
            --disable-docs \
            --disable-werror \
            --disable-qom-cast-debug \
            --disable-stack-protector

      - name: Check that the install is relocatable
        # QEMU resolves its data directory relative to the executable, but only
        # if CONFIG_PREFIX has at least one path component: starts_with_prefix()
        # requires a separator after the prefix, which "/" can never satisfy.
        # With prefix "/" every lookup falls back to the literal built-in path,
        # so the package looks for its ROMs in <drive>:\share and only works
        # when started with "-L share". The prefix itself never appears at
        # runtime; it only anchors the bindir -> datadir offset.
        run: |
          prefix=$(sed -n 's/^#define CONFIG_PREFIX "\(.*\)"$/\1/p' \
                   build/config-host.h)
          case "$prefix" in
            /?*) echo "relocatable install anchored at $prefix" ;;
            *) echo "CONFIG_PREFIX '$prefix' disables relocation" >&2; exit 1 ;;
          esac

      - name: Build QEMU + firmware
        run: |
          set -o pipefail
          ninja -C build 2>&1 | tee build/ninja-build.log

      - name: Assemble Windows package
        # Windows installs use a flat layout: .exe files at the prefix root,
        # firmware blobs in share/ beside them. DESTDIR puts that layout under
        # dist/qemu, which is the directory that gets published — the package
        # is portable, so it runs from wherever the user unpacks it. The IA-64
        # firmware is install:false in meson, so copy it in explicitly, then
        # pull in the mingw runtime DLLs the binaries link against (three
        # passes to converge on transitive dependencies; system DLLs like
        # kernel32 aren't in the sysroot and are skipped naturally).
        run: |
          DESTDIR=$PWD/dist ninja -C build install
          cp build/roms/ia64-firmware/ia64-firmware.bin dist/qemu/share/
          # Link-time only: headers plus libfdt.a and libslirp.dll.a. The
          # slirp DLL the emulator actually loads is libslirp-0.dll at the
          # package root and is not affected.
          rm -rf dist/qemu/include dist/qemu/lib
          MINGW_PREFIX=/usr/x86_64-w64-mingw32/sys-root/mingw
          SYSROOT=$MINGW_PREFIX/bin
          # GTK needs its GSettings schemas at runtime or dialogs can abort;
          # compile them from the sysroot into the package (best-effort).
          if [ -d "$MINGW_PREFIX/share/glib-2.0/schemas" ]; then
            mkdir -p dist/qemu/share/glib-2.0/schemas
            glib-compile-schemas \
              --targetdir=dist/qemu/share/glib-2.0/schemas \
              "$MINGW_PREFIX/share/glib-2.0/schemas" || true
          fi
          cd dist/qemu
          # Fedora's mingw64-SDL2 is sdl2-compat: SDL2.dll dlopens SDL3.dll at
          # runtime, which an import-table sweep cannot see. Seed such
          # runtime-loaded DLLs first so the sweep below also resolves their
          # own imports.
          for extra in SDL3.dll; do
            if [ -f "$SYSROOT/$extra" ]; then
              cp "$SYSROOT/$extra" .
            fi
          done
          for pass in 1 2 3; do
            for f in *.exe *.dll; do
              x86_64-w64-mingw32-objdump -p "$f" 2>/dev/null | awk '/DLL Name/{print $3}'
            done | sort -u | while read -r dll; do
              if [ ! -f "$dll" ] && [ -f "$SYSROOT/$dll" ]; then
                cp "$SYSROOT/$dll" .
              fi
            done
          done
          # A package that links SDL2 but lacks SDL3 fails only at runtime
          # ("Failed loading SDL3 library") — catch it here instead.
          if [ -f SDL2.dll ] && [ ! -f SDL3.dll ]; then
            echo "SDL2.dll is present but SDL3.dll is missing" >&2
            exit 1
          fi
          ls -l *.exe *.dll

      - name: Upload Windows package
        uses: actions/upload-artifact@v4
        with:
          name: qemu-system-ia64-win64
          path: dist/qemu/
          if-no-files-found: error

      - name: Upload build logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: windows-build-logs
          path: |
            build/meson-logs/
            build/ninja-build.log
          if-no-files-found: ignore

  macos:
    # One package per architecture, each built and smoke-tested natively on a
    # runner that is free for public repositories. The build OS sets the floor,
    # not the ceiling: Mach-O binaries stay forward compatible, so each package
    # runs on its build OS and every later release. It will NOT run on an
    # earlier one -- clang's default deployment target and the Homebrew bottles
    # it links against are both built for the runner's own OS version.
    #
    #   arm64   macos-14        -> macOS 14+   (oldest arm64 image on offer)
    #   x86_64  macos-15-intel  -> macOS 15+   (oldest Intel image on offer;
    #                                           the alternative, macos-26-intel,
    #                                           would raise the floor to 26)
    #
    # Both macos-14 labels are already marked deprecated, and GitHub retires
    # x86_64 Actions runners entirely in 2027; when macos-14 goes, move the
    # arm64 build to macos-15 and the floor rises with it.
    #
    # macos-14-large would give an Intel build on macOS 14, but it is a larger
    # runner and those need a Team/Enterprise plan.
    #
    # A single universal binary was considered and rejected: cross-building
    # x86_64 on the arm64 runner means a second Homebrew prefix of Intel
    # bottles for every dependency, lipo'ing each bundled dylib as well as the
    # emulator, and building twice anyway -- and the arm64 images carry no
    # Rosetta, so the x86_64 half could never be run before publishing it.
    # Two natively tested packages beat one untested fat one.
    name: macOS build (${{ matrix.arch }}, macOS ${{ matrix.min_os }}+)
    needs: linux
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            runner: macos-14
            min_os: "14"
          - arch: x86_64
            runner: macos-15-intel
            min_os: "15"
    env:
      HOMEBREW_NO_AUTO_UPDATE: 1
      HOMEBREW_NO_INSTALL_CLEANUP: 1
      HOMEBREW_NO_ENV_HINTS: 1
    steps:
      - name: Install dependencies
        # Curated to libraries that relocate cleanly: every one of these is a
        # plain dylib, and Cocoa (the native equivalent of the Linux package's
        # GTK display) plus CoreAudio are system frameworks that cost nothing.
        # Deliberately left out: GTK, whose dlopen'd module stack is fragile to
        # bundle on macOS, and gnutls / curl / libusb / usbredir / curses. Any
        # of them is one formula plus one --enable- switch away.
        run: |
          brew install --quiet glib pixman libslirp libpng jpeg-turbo zstd \
                               sdl2 ninja ccache
          command -v pkg-config >/dev/null || brew install --quiet pkgconf
          # jpeg-turbo is keg-only, so its libjpeg.pc is off the default path.
          echo "PKG_CONFIG_PATH=$(brew --prefix jpeg-turbo)/lib/pkgconfig:${PKG_CONFIG_PATH:-}" \
            >> "$GITHUB_ENV"
          # ccache's cc/clang shims have to come first in PATH.
          ccache_libexec="$(brew --prefix ccache)/libexec"
          if [ -d "$ccache_libexec" ]; then
            echo "$ccache_libexec" >> "$GITHUB_PATH"
          fi

      - uses: actions/checkout@v4

      - name: Download the IA-64 firmware
        # The firmware needs an IA-64 cross toolchain, which does not exist for
        # macOS, so it is taken from the linux job instead of being built here.
        uses: actions/download-artifact@v4
        with:
          name: ia64-firmware
          path: fw

      - name: Restore ccache
        uses: actions/cache@v4
        with:
          path: .ccache
          key: ccache-macos-${{ matrix.arch }}-${{ github.sha }}
          restore-keys: ccache-macos-${{ matrix.arch }}-

      - name: Configure
        # Feature set and optimization settings follow the .deb pipeline in
        # build/deb/in-container.sh: --without-default-features plus an
        # explicit list, LTO, -Doptimization=2 (the level is set through Meson
        # only, never as -O in --extra-cflags, so exactly one reaches the
        # compiler) and install-time strip. The perf cflags are probed because
        # Apple clang does not accept all of GCC's.
        #
        # --disable-tools keeps qemu-img and friends out: it makes the package
        # minimal, and together with --disable-fdt (nothing on these machines
        # needs a device tree, and the internal libfdt is a downloaded meson
        # subproject) it cuts the *built* files in the install manifest down to
        # exactly two, which is what lets the staging step below install
        # without building the firmware. Use Homebrew's qemu for image tools.
        run: |
          extra_cflags=""
          for flag in -fno-stack-protector -fzero-call-used-regs=skip \
                      -ftrivial-auto-var-init=uninitialized; do
            if printf 'int main(void){return 0;}\n' | \
               cc "$flag" -x c -c -o /dev/null - >/dev/null 2>&1; then
              extra_cflags="${extra_cflags:+$extra_cflags }$flag"
            else
              echo "    (compiler lacks $flag - skipping)"
            fi
          done
          echo "    extra-cflags: $extra_cflags"
          mkdir build
          cd build
          ../configure \
            --prefix=/qemu \
            --target-list=ia64-softmmu \
            --without-default-features \
            --enable-system --enable-tcg \
            --enable-pixman --disable-fdt \
            --enable-cocoa --enable-sdl \
            --enable-vnc --enable-png -Dvnc_jpeg=enabled \
            -Dzstd=enabled --enable-slirp \
            -Dcoreaudio=enabled --audio-drv-list=coreaudio \
            --enable-vpc --enable-vhdx --enable-vdi --enable-vmdk --enable-qed \
            --enable-qcow1 --enable-parallels --enable-vvfat --enable-bochs \
            --enable-cloop --enable-dmg \
            --disable-tools --disable-guest-agent \
            --disable-docs --disable-werror \
            --disable-qom-cast-debug --disable-stack-protector \
            --enable-lto --enable-strip -Doptimization=2 \
            --extra-cflags="$extra_cflags"

      - name: Check that the install is relocatable
        # Same contract as the other two jobs: the package is used from
        # wherever it is unpacked, so share/qemu must be found relative to the
        # binary. A single-component prefix such as "/" silently turns that
        # off -- see the Windows job for why.
        run: |
          prefix=$(sed -n 's/^#define CONFIG_PREFIX "\(.*\)"$/\1/p' \
                   build/config-host.h)
          case "$prefix" in
            /?*) echo "relocatable install anchored at $prefix" ;;
            *) echo "CONFIG_PREFIX '$prefix' disables relocation" >&2; exit 1 ;;
          esac

      - name: Build qemu-system-ia64
        # These two named targets are exactly the built files the install
        # manifest wants (`meson introspect --installed`); naming them instead
        # of running plain ninja is what keeps the firmware custom_target --
        # build_by_default, and impossible here without an IA-64 cross
        # compiler -- out of the build.
        #
        # On Darwin qemu-system-ia64 is a custom_target that post-processes the
        # real executable (Meson names it qemu-system-ia64-unsigned) to attach
        # the QEMU icon. That step needs full Xcode, which the runner images
        # have; Homebrew builds QEMU the same way on the same images.
        run: |
          set -o pipefail
          ninja -C build qemu-system-ia64 trace/trace-events-all \
            2>&1 | tee build/ninja-build.log
          ccache -s || true

      - name: Assemble macOS package
        # --no-rebuild is what keeps `meson install` from invoking ninja and
        # thereby building the firmware (build_by_default, install:false). It
        # does still check that every file in the manifest exists, which is why
        # the build step above names trace-events-all as well as the emulator;
        # everything else installed here is a static blob, keymap or icon.
        run: |
          build/pyvenv/bin/meson install -C build --no-rebuild \
            --destdir "$PWD/dist"
          cp fw/ia64-firmware.bin dist/qemu/share/qemu/
          # Nothing in this feature set installs headers or a lib/ of its own,
          # but keep the guard: lib/ must hold the bundled dylibs and nothing
          # else.
          rm -rf dist/qemu/include dist/qemu/lib
          cat > dist/qemu/README.txt <<'TXT'
          qemu-system-ia64 for macOS
          ==========================

          Built on macOS ${{ matrix.min_os }} for ${{ matrix.arch }}; runs on
          macOS ${{ matrix.min_os }} and later, on Macs of that architecture.

          GitHub strips the executable bit from artifact downloads, and macOS
          quarantines anything that arrives from the web. After unpacking:

              chmod +x bin/qemu-system-ia64
              xattr -dr com.apple.quarantine .

          Then run bin/qemu-system-ia64 from wherever you put it -- it finds
          share/qemu (the IA-64 firmware, video BIOSes, keymaps) next to
          itself, and the libraries it needs are in lib/.
          TXT

      - name: Bundle dependent dylibs and re-sign
        # The macOS analogue of the Windows job's DLL sweep: three passes
        # converge on transitive dependencies. Anything under /usr/lib or
        # /System is part of macOS and must not be copied.
        run: |
          cd dist/qemu
          mkdir -p lib
          for pass in 1 2 3; do
            for f in bin/* lib/*.dylib; do
              [ -f "$f" ] || continue
              otool -L "$f" | awk '/^\t/ {print $1}'
            done | sort -u | while read -r dep; do
              case "$dep" in /usr/lib/*|/System/*|@*) continue ;; esac
              base="${dep##*/}"
              if [ ! -f "lib/$base" ]; then
                cp -L "$dep" "lib/$base"
                chmod u+w "lib/$base"
              fi
            done
          done
          # Rewrite every absolute reference to @rpath and anchor the rpath to
          # the package layout, so it runs from wherever it is unpacked.
          for f in lib/*.dylib; do
            install_name_tool -id "@rpath/${f##*/}" "$f"
          done
          for f in bin/* lib/*.dylib; do
            otool -L "$f" | awk '/^\t/ {print $1}' | while read -r dep; do
              case "$dep" in /usr/lib/*|/System/*|@*) continue ;; esac
              install_name_tool -change "$dep" "@rpath/${dep##*/}" "$f"
            done
          done
          install_name_tool -add_rpath "@executable_path/../lib" \
                            bin/qemu-system-ia64 || true
          for f in lib/*.dylib; do
            install_name_tool -add_rpath "@loader_path" "$f" || true
          done
          # install_name_tool and the install-time strip both invalidate the
          # ad-hoc signature the linker applies, and an arm64 binary whose
          # signature does not match is killed on sight. Re-sign, ad-hoc.
          for f in bin/* lib/*.dylib; do
            codesign --force --sign - "$f"
          done
          codesign --verify --strict bin/qemu-system-ia64
          # A dependency left pointing into the Homebrew prefix (/opt/homebrew
          # on arm64, /usr/local on Intel) only fails on someone else's Mac,
          # so fail here instead.
          leftovers=$(otool -L bin/* lib/*.dylib | awk '/^\t/ {print $1}' |
                      sort -u | grep -Ev '^(@|/usr/lib/|/System/)' || true)
          if [ -n "$leftovers" ]; then
            echo "unbundled dependencies:" >&2
            echo "$leftovers" >&2
            exit 1
          fi
          ls -l bin lib

      - name: Smoke-test the package
        # Runs the *packaged* binary, which is what proves the bundled dylibs
        # resolve, the ad-hoc signature survived, and the relocated datadir
        # lookup finds the injected firmware -- note the deliberate absence of
        # -bios. The firmware banner appears within a second or two of the
        # machine starting; the sleep is slack, not a wait for progress.
        run: |
          cd dist/qemu
          ./bin/qemu-system-ia64 -version
          ./bin/qemu-system-ia64 -machine help | grep -E '^(zx1|460gx) '
          ./bin/qemu-system-ia64 \
            -M zx1,firmware-console=serial,nvram=none,firmware-boot-timeout=1 \
            -m 1G -display none -monitor none -serial file:"$PWD/boot.log" &
          pid=$!
          sleep 30
          kill "$pid" 2>/dev/null || true
          wait "$pid" 2>/dev/null || true
          cat boot.log
          grep -q "qemu-system-ia64 Firmware" boot.log
          rm -f boot.log

      - name: Upload macOS package
        uses: actions/upload-artifact@v4
        with:
          name: qemu-system-ia64-macos-${{ matrix.arch }}
          path: dist/qemu/
          if-no-files-found: error

      - name: Upload build logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: macos-${{ matrix.arch }}-build-logs
          path: |
            build/meson-logs/
            build/ninja-build.log
          if-no-files-found: ignore
